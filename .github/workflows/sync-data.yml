name: Sync J.League Data

on:
  schedule:
    # Daily at 00:00 JST (15:00 UTC)
    - cron: '0 15 * * *'
    # Matchdays (Wed/Sat/Sun) at 22:00 JST (13:00 UTC)
    - cron: '0 13 * * 0,3,6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-jleague-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync data from API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_FOOTBALL_TEAM_ID: ${{ vars.API_FOOTBALL_TEAM_ID }}
          API_FOOTBALL_LEAGUE_ID: ${{ vars.API_FOOTBALL_LEAGUE_ID }}
          API_FOOTBALL_SEASON: ${{ vars.API_FOOTBALL_SEASON }}
        run: node scripts/sync-api-football.mjs

      - name: Commit updated JSON files
        run: |
          if git diff --quiet public/api/v1; then
            echo "No changes in public/api/v1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/api/v1/meta.json public/api/v1/standings.json public/api/v1/matches.json public/api/v1/players.json
          git commit -m "chore(data): sync latest J.League data"
          git push
