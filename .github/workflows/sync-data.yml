name: Sync J.League Data

on:
  schedule:
    # Sun, Mon, Thu at 07:00 JST (Sat, Sun, Wed 22:00 UTC) — after matchdays with time-lag tolerance
    - cron: '0 22 * * 0,3,6'
  workflow_dispatch:
    inputs:
      sync_players:
        description: '選手名鑑（players.json）も強制更新する'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-jleague-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync data via Gemini API (Google Search Grounding)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SEASON_LABEL: ${{ vars.SEASON_LABEL }}
          COMPETITION_NAME: ${{ vars.COMPETITION_NAME }}
          SYNC_PLAYERS: ${{ inputs.sync_players }}
        run: node scripts/sync-gemini-search.mjs

      - name: Commit updated JSON files
        run: |
          if git diff --quiet public/api/v1; then
            echo "No changes in public/api/v1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/api/v1/meta.json public/api/v1/standings.json public/api/v1/matches.json public/api/v1/players.json
          git commit -m "chore(data): sync latest J.League data via Gemini Search Grounding"
          git push
